[project]
name = "multi-agent-ctf"
version = "0.1.0"
description = "Lightweight multi-agent Capture the Flag research environment (Prototype 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Reinforcement-learning agent (training, evaluation, plots).
# PyTorch stopped publishing Intel-Mac (macosx x86_64) wheels after 2.2.2, and 2.2.x needs
# numpy 1.x, so Intel Macs get those pinned versions; every other platform gets current ones.
rl = [
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tensorboard>=2.15",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctf", "src/coordination", "src/strategies", "src/rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
