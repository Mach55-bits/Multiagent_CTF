[project]
name = "multi-agent-ctf"
version = "0.1.0"
description = "Lightweight multi-agent Capture the Flag research environment (Prototype 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Reinforcement-learning agent (training, evaluation, plots).
rl = [
    "numpy>=1.26",
    "torch>=2.2",
    "tensorboard>=2.15",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctf", "src/coordination", "src/strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
