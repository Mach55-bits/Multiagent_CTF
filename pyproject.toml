[project]
name = "multi-agent-ctf"
version = "0.1.0"
description = "Lightweight multi-agent Capture the Flag research environment (Prototype 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctf"]

[tool.hatch.build.targets.wheel.force-include]
"src/ctf" = "ctf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
